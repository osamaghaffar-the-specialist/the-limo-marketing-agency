name: P2 Data URI Probe

on:
  push:
    branches:
      - seo-p2-performance

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repeated embedded image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, base64, struct
          pat=re.compile(r'data:(image/[^;"\']+);base64,([A-Za-z0-9+/=\r\n]+)',re.I)
          target='229c49f149a86c48'
          seen=False
          for path in sorted(Path('.').glob('*.html')):
              text=path.read_text(encoding='utf-8',errors='replace')
              for m in pat.finditer(text):
                  payload=''.join(m.group(2).split())
                  fp=hashlib.sha256(payload.encode()).hexdigest()[:16]
                  if fp!=target: continue
                  raw=base64.b64decode(payload)
                  mime=m.group(1)
                  dims='unknown'
                  if raw.startswith(b'\x89PNG\r\n\x1a\n') and len(raw)>=24:
                      w,h=struct.unpack('>II',raw[16:24]); dims=f'{w}x{h}'
                  a=max(0,m.start()-180); b=min(len(text),m.end()+180)
                  context=' '.join(text[a:b].replace(payload,'[BASE64]').split())
                  print(f'FOUND|FILE={path.name}|MIME={mime}|RAW_BYTES={len(raw)}|DIMS={dims}|SHA16={fp}')
                  print('CONTEXT|'+context[:900])
                  seen=True
                  raise SystemExit(0)
          if not seen:
              raise SystemExit('target fingerprint not found')
          PY
