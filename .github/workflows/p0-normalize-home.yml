name: P0 Normalize Core SEO GEO Signals

on:
  push:
    branches:
      - seo-p0-normalization
    paths:
      - 'scripts/p0_normalize_home.py'
      - 'scripts/p0_schema_graph.py'
      - '.github/workflows/p0-normalize-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p0-normalization
          fetch-depth: 0

      - name: Normalize homepage URL signals
        run: python scripts/p0_normalize_home.py

      - name: Normalize schema entity graph
        run: python scripts/p0_schema_graph.py

      - name: Validate diff
        run: |
          git diff --check
          grep -F '<loc>https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/</loc>' sitemap.xml
          ! grep -R -F 'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/index.html' --include='*.html' .
          ! grep -R -F 'href="index.html"' --include='*.html' .
          grep -F '<meta property="og:url" content="https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/booking-systems.html"/>' booking-systems.html
          grep -F '"@id": "https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/#website"' google-ads-for-limo-companies.html

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Strengthen P0 SEO GEO entity graph and booking metadata'
          git push origin HEAD:seo-p0-normalization
