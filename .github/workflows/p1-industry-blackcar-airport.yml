name: P1 Industry Black Car Airport Optimization

on:
  push:
    branches:
      - seo-p1-industry-blackcar-airport
    paths:
      - 'scripts/p1_industry_blackcar_airport.py'
      - '.github/workflows/p1-industry-blackcar-airport.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p1-industry-blackcar-airport
      - name: Optimize black car and airport industry pages
        run: python scripts/p1_industry_blackcar_airport.py
      - name: Validate diff
        run: git diff --check
      - name: Commit optimized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add black-car-services.html airport-transportation-companies.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize black car and airport industry intent"
          git push origin HEAD:seo-p1-industry-blackcar-airport
