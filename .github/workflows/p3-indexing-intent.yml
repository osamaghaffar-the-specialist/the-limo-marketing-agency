name: P3 Indexing Intent Gate

on:
  push:
    branches:
      - seo-p3-indexing-intent

permissions:
  contents: write

jobs:
  p3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified indexing and intent fixes
        run: python .github/scripts/p3_indexing_intent.py
      - name: Validate exact intended diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html sitemap.xml | sort)"
          test "$changed" = "$expected"
          git diff --stat
          grep -q 'Explore Limo SEO Services' index.html
          test "$(grep -c '<lastmod>' sitemap.xml)" -eq 21
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "P3: Strengthen indexing and SEO intent signals"
          git push
