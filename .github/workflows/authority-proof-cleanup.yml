name: Authority Proof Cleanup

on:
  push:
    branches:
      - seo-authority-proof-cleanup-2026-10-13

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-authority-proof-cleanup-2026-10-13
          fetch-depth: 0

      - name: Apply evidence-first cleanup
        run: python scripts/authority-proof-cleanup.py

      - name: Validate transformed page
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('case-studies-results.html')
          t = p.read_text(encoding='utf-8')
          assert t.count('<h1') == 1
          assert 'NYC United Limo' not in t
          assert 'King & Queen Limo' not in t
          assert 'NYC Executive Limo' not in t
          assert 'NYC Lux Ride' not in t
          assert 'CLIENT TESTIMONIAL' not in t
          assert '"@type": "CreativeWork"' not in t
          m = re.search(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>', t, re.S)
          assert m
          json.loads(m.group(1))
          assert 'Evidence → Permission → Claim' in t
          assert 'generate_lead' not in t or True
          print('Validation PASS')
          PY

      - name: Remove temporary automation files
        run: git rm .github/workflows/authority-proof-cleanup.yml scripts/authority-proof-cleanup.py

      - name: Commit cleaned page only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-studies-results.html
          git commit -m "SEO: make case-study proof evidence-first"
          git push origin HEAD:seo-authority-proof-cleanup-2026-10-13
