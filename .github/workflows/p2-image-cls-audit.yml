name: P2 Image and CLS Audit

on:
  push:
    branches:
      - seo-p2-images-cls

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit homepage images and large assets
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from PIL import Image
          import os, re

          root = Path('.')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8', errors='strict')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.imgs=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'img':
                      self.imgs.append(dict(attrs))

          p=P(); p.feed(text)
          print('===== HOMEPAGE IMG AUDIT =====')
          print('IMG_COUNT', len(p.imgs))
          missing_dims=0
          missing_lazy=0
          local_total=0
          for i,a in enumerate(p.imgs,1):
              src=a.get('src','')
              width=a.get('width')
              height=a.get('height')
              loading=a.get('loading')
              alt=a.get('alt')
              if not width or not height: missing_dims += 1
              if (loading or '').lower() != 'lazy': missing_lazy += 1
              path=None
              intrinsic='NA'
              size='NA'
              if src and not src.startswith(('http://','https://','//','data:')):
                  clean=urlsplit(src).path
                  if clean.startswith('./'): clean=clean[2:]
                  path=root/clean
                  if path.is_file():
                      size=path.stat().st_size
                      local_total += size
                      try:
                          with Image.open(path) as im:
                              intrinsic=f'{im.width}x{im.height}'
                      except Exception as e:
                          intrinsic=f'ERR:{type(e).__name__}'
              print(f'IMG|{i}|SRC={src}|ATTR={width}x{height}|INTRINSIC={intrinsic}|BYTES={size}|LOADING={loading}|ALT={alt}')

          print('IMG_MISSING_DIMS', missing_dims)
          print('IMG_NOT_LAZY', missing_lazy)
          print('LOCAL_IMG_BYTES_REFERENCED', local_total)

          print('\n===== MAP ASSET =====')
          map_path=root/'assets'/'home-worldwide-map-hd.png'
          if map_path.is_file():
              with Image.open(map_path) as im:
                  print('MAP_DIMENSIONS', f'{im.width}x{im.height}')
                  print('MAP_MODE', im.mode)
                  print('MAP_FORMAT', im.format)
              print('MAP_BYTES', map_path.stat().st_size)
              refs=[]
              for f in root.rglob('*'):
                  if f.is_file() and f.suffix.lower() in {'.html','.css','.js','.xml','.txt','.md'}:
                      try: t=f.read_text(encoding='utf-8',errors='ignore')
                      except: continue
                      if 'home-worldwide-map-hd.png' in t:
                          refs.append(f.as_posix())
              print('MAP_REF_COUNT', len(refs))
              print('MAP_REFS', ','.join(refs))
          else:
              print('MAP_MISSING')

          print('\n===== LARGE STATIC ASSETS TOP 20 =====')
          files=[]
          for f in root.rglob('*'):
              if f.is_file() and '.git' not in f.parts:
                  files.append((f.stat().st_size,f.as_posix()))
          for size,name in sorted(files, reverse=True)[:20]:
              print(f'ASSET|{name}|BYTES={size}')

          print('\nAUDIT_DONE')
          PY
