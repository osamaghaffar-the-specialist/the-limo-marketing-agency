name: Measurement foundation 2026-10-12

on:
  push:
    branches:
      - measurement-foundation-2026-10-12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: measurement-foundation-2026-10-12
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply and validate measurement foundation
        run: python .github/seo-assets/patch-measurement-foundation.py

      - name: Remove temporary automation files
        run: |
          rm .github/seo-assets/patch-measurement-foundation.py
          rm .github/workflows/measurement-foundation-2026-10-12.yml

      - name: Commit validated measurement foundation
        run: |
          git config user.name "Usama Ghaffar"
          git config user.email "osamaghaffar001@gmail.com"
          git add index.html contact.html thank-you.html .github/seo-assets/patch-measurement-foundation.py .github/workflows/measurement-foundation-2026-10-12.yml
          git diff --cached --quiet && exit 0
          git commit -m "Measurement: Prepare success-only GA4 lead event"
          git push origin HEAD:measurement-foundation-2026-10-12
