name: P2 Sitewide Specialist Cleanup

on:
  push:
    branches:
      - seo-p2-sitewide-specialist-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified sitewide fixes and crawl gate
        run: python .github/scripts/sitewide_specialist_cleanup.py
      - name: Validate exact intended page diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            about.html \
            airport-transportation-companies.html \
            black-car-services.html \
            case-studies-results.html \
            chauffeur-companies.html \
            how-much-should-limo-company-spend-google-ads-2026.html \
            limousine-companies.html \
            privacy-policy.html \
            resources.html \
            terms.html \
            why-limo-google-ads-get-expensive.html | sort)"
          test "$changed" = "$expected"
          git diff --stat
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html airport-transportation-companies.html black-car-services.html case-studies-results.html chauffeur-companies.html how-much-should-limo-company-spend-google-ads-2026.html limousine-companies.html privacy-policy.html resources.html terms.html why-limo-google-ads-get-expensive.html
          git commit -m "P2: Complete sitewide technical cleanup"
          git push
