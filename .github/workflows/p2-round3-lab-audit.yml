name: P2 Round 3 Lab Audit

on:
  push:
    branches:
      - seo-p2-round3-lab-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static CSS and JS audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          t=p.read_text(encoding='utf-8',errors='strict')
          styles=re.findall(r'<style\b[^>]*>(.*?)</style>',t,re.I|re.S)
          scripts_inline=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',t,re.I|re.S)
          script_tags=re.findall(r'<script\b[^>]*>',t,re.I|re.S)
          css_links=re.findall(r'<link\b[^>]*rel=["\'][^"\']*stylesheet[^"\']*["\'][^>]*>',t,re.I|re.S)
          preloads=re.findall(r'<link\b[^>]*rel=["\']preload["\'][^>]*>',t,re.I|re.S)
          print('===== STATIC HOMEPAGE PERFORMANCE AUDIT =====')
          print('HTML_BYTES',p.stat().st_size)
          print('STYLE_BLOCK_COUNT',len(styles))
          print('STYLE_BLOCK_BYTES',sum(len(x.encode("utf-8")) for x in styles))
          print('INLINE_SCRIPT_COUNT',len(scripts_inline))
          print('INLINE_SCRIPT_BYTES',sum(len(x.encode("utf-8")) for x in scripts_inline))
          print('SCRIPT_TAG_COUNT',len(script_tags))
          for i,s in enumerate(script_tags,1):
              src=re.search(r'\bsrc=["\']([^"\']+)',s,re.I)
              print(f'SCRIPT|{i}|SRC={(src.group(1) if src else "INLINE")}|DEFER={bool(re.search(r"\\bdefer\\b",s,re.I))}|ASYNC={bool(re.search(r"\\basync\\b",s,re.I))}|TYPE_MODULE={bool(re.search(r"type=[\"\']module",s,re.I))}')
          print('STYLESHEET_LINK_COUNT',len(css_links))
          for i,s in enumerate(css_links,1):
              href=re.search(r'\bhref=["\']([^"\']+)',s,re.I)
              print(f'STYLESHEET|{i}|HREF={(href.group(1) if href else "")}|MEDIA={"media=" in s.lower()}')
          print('PRELOAD_COUNT',len(preloads))
          for i,s in enumerate(preloads,1):
              href=re.search(r'\bhref=["\']([^"\']+)',s,re.I)
              asv=re.search(r'\bas=["\']([^"\']+)',s,re.I)
              print(f'PRELOAD|{i}|HREF={(href.group(1) if href else "")}|AS={(asv.group(1) if asv else "")}')
          print('STATIC_AUDIT_DONE')
          PY

      - name: Lighthouse mobile and desktop
        run: |
          URL='https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/'
          npx --yes lighthouse@latest "$URL" \
            --quiet \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --only-categories=performance \
            --output=json \
            --output-path=/tmp/lh-mobile.json
          npx --yes lighthouse@latest "$URL" \
            --quiet \
            --chrome-flags='--headless --no-sandbox --disable-gpu' \
            --preset=desktop \
            --only-categories=performance \
            --output=json \
            --output-path=/tmp/lh-desktop.json

          python - <<'PY'
          import json
          from pathlib import Path

          def show(label,path):
              d=json.loads(Path(path).read_text())
              a=d['audits']
              score=round(d['categories']['performance']['score']*100)
              print(f'===== LIGHTHOUSE {label} =====')
              print('PERFORMANCE_SCORE',score)
              keys=[
                  ('FCP','first-contentful-paint'),
                  ('LCP','largest-contentful-paint'),
                  ('SPEED_INDEX','speed-index'),
                  ('TBT','total-blocking-time'),
                  ('CLS','cumulative-layout-shift'),
                  ('TTI','interactive'),
              ]
              for out,k in keys:
                  x=a.get(k,{})
                  print(out, x.get('displayValue'), 'NUMERIC', x.get('numericValue'))
              opps=[
                  'render-blocking-resources',
                  'unused-css-rules',
                  'unused-javascript',
                  'unminified-css',
                  'unminified-javascript',
                  'uses-long-cache-ttl',
                  'uses-text-compression',
                  'uses-responsive-images',
                  'offscreen-images',
                  'modern-image-formats',
                  'uses-optimized-images',
                  'total-byte-weight',
                  'mainthread-work-breakdown',
                  'bootup-time',
                  'network-requests',
                  'dom-size',
                  'font-display',
              ]
              for k in opps:
                  x=a.get(k)
                  if not x: continue
                  details=x.get('details') or {}
                  print(f'AUDIT|{k}|SCORE={x.get("score")}|DISPLAY={x.get("displayValue")}|SAVINGS_MS={details.get("overallSavingsMs")}|SAVINGS_BYTES={details.get("overallSavingsBytes")}')
              lcp=a.get('largest-contentful-paint-element',{})
              print('LCP_ELEMENT', lcp.get('displayValue'))
              print('FINAL_URL',d.get('finalUrl'))

          show('MOBILE','/tmp/lh-mobile.json')
          show('DESKTOP','/tmp/lh-desktop.json')
          print('LIGHTHOUSE_AUDIT_DONE')
          PY
