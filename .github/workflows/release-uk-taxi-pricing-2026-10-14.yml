name: Release UK Taxi Pricing 2026-10-14

on:
  push:
    branches:
      - seo-release-uk-taxi-pricing-2026-10-14
    paths:
      - scripts/release-uk-taxi-pricing-2026-10-14.py
      - .github/workflows/release-uk-taxi-pricing-2026-10-14.yml

permissions:
  contents: write

jobs:
  release-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-release-uk-taxi-pricing-2026-10-14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import approved pre-release draft
        run: |
          git fetch origin seo-build-uk-taxi-dispatch-prices-pre-release
          mkdir -p uk/taxi-dispatch-system-prices
          git show origin/seo-build-uk-taxi-dispatch-prices-pre-release:uk/taxi-dispatch-system-prices/index.html > uk/taxi-dispatch-system-prices/index.html
      - name: Apply release gates and discovery updates
        run: python scripts/release-uk-taxi-pricing-2026-10-14.py
      - name: Validate release state
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('uk/taxi-dispatch-system-prices/index.html').read_text(encoding='utf-8')
          assert 'content="index,follow' in page
          assert 'noindex' not in page.lower()
          assert 'Pre-release build:' not in page
          assert '14 October 2026' in page
          assert 'G-DXCDK9ZELZ' in page
          assert 'rel="icon"' in page
          assert 'https://taxidespatch.co.uk/' in page
          assert 'https://taxidispatchsystems.co.uk/' in page
          assert 'https://cabsoluit.com/taxi-dispatch-system-prices/' in page
          assert 'https://tbmslive.com/pricing.php' in page
          assert 'https://info.icabbi.etgl.co.uk/discover' in page
          assert 'https://www.taxicaller.com/en/pricing' in page
          resources=Path('resources.html').read_text(encoding='utf-8')
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          url='https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/uk/taxi-dispatch-system-prices/'
          assert url in resources
          assert url in sitemap
          print('RELEASE_VALIDATION=PASS')
          PY
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uk/taxi-dispatch-system-prices/index.html resources.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "SEO: prepare UK taxi dispatch pricing guide for release"
            git push origin HEAD:seo-release-uk-taxi-pricing-2026-10-14
          fi
