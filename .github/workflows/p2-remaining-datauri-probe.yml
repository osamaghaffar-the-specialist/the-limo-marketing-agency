name: P2 Remaining Data URI Probe

on:
  push:
    branches:
      - seo-p2-performance

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining embedded images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, base64, struct
          from collections import defaultdict

          pat=re.compile(r'data:(image/[^;"\']+);base64,([A-Za-z0-9+/=\r\n]+)',re.I)
          found=defaultdict(lambda:{'mime':None,'raw':None,'files':set(),'count':0,'ctx':None})

          def dims(raw,mime):
              try:
                  if raw.startswith(b'\x89PNG\r\n\x1a\n') and len(raw)>=24:
                      return '%dx%d'%struct.unpack('>II',raw[16:24])
                  if raw[:3]==b'GIF' and len(raw)>=10:
                      w,h=struct.unpack('<HH',raw[6:10]); return f'{w}x{h}'
                  if raw.startswith(b'\xff\xd8'):
                      i=2
                      while i+9<len(raw):
                          if raw[i]!=0xFF: i+=1; continue
                          marker=raw[i+1]; i+=2
                          if marker in (0xD8,0xD9): continue
                          if i+2>len(raw): break
                          ln=int.from_bytes(raw[i:i+2],'big')
                          if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF) and i+7<len(raw):
                              h=int.from_bytes(raw[i+3:i+5],'big'); w=int.from_bytes(raw[i+5:i+7],'big'); return f'{w}x{h}'
                          i+=max(ln,2)
                  if mime.lower()=='image/svg+xml':
                      s=raw[:500].decode('utf-8','ignore').replace('\n',' ')
                      m=re.search(r'<svg[^>]*(?:viewBox=["\']([^"\']+)|width=["\']([^"\']+)["\'][^>]*height=["\']([^"\']+)["\'])',s,re.I)
                      return 'svg:'+(m.group(0)[:140] if m else 'unknown')
              except Exception:
                  pass
              return 'unknown'

          for path in sorted(Path('.').glob('*.html')):
              text=path.read_text(encoding='utf-8',errors='replace')
              for m in pat.finditer(text):
                  payload=''.join(m.group(2).split())
                  fp=hashlib.sha256(payload.encode()).hexdigest()[:16]
                  raw=base64.b64decode(payload)
                  d=found[fp]
                  d['mime']=m.group(1).lower(); d['raw']=raw; d['files'].add(path.name); d['count']+=1
                  if d['ctx'] is None:
                      a=max(0,m.start()-140); b=min(len(text),m.end()+140)
                      ctx=' '.join(text[a:b].replace(m.group(0),'[DATA_URI]').split())
                      d['ctx']=ctx[:500]

          print('UNIQUE',len(found),'OCCURRENCES',sum(d['count'] for d in found.values()))
          for fp,d in sorted(found.items(),key=lambda kv:len(kv[1]['raw']),reverse=True):
              print(f'ITEM|{fp}|MIME={d["mime"]}|RAW_BYTES={len(d["raw"])}|DIMS={dims(d["raw"],d["mime"])}|COUNT={d["count"]}|FILES={sorted(d["files"])}')
              print('CTX|'+d['ctx'])
          PY
