name: P2 Core Organization Logo Fix

on:
  push:
    branches:
      - seo-p2-core-schema-logo

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply core Organization logo fix
        run: python .github/scripts/fix_core_org_logo.py
      - name: Validate diff
        run: |
          git diff --check
          git status --short
      - name: Commit intended page changes
        run: |
          if git diff --quiet; then
            echo "No page changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services.html industries.html seo-for-limo-companies.html google-ads-for-limo-companies.html geo-ai-search-optimization.html limo-website-design.html booking-systems.html social-media-marketing-for-limo-companies.html contact.html
          git commit -m "P2: Add Organization logo schema to core pages"
          git push
