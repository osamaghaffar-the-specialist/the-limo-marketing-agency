name: One-time booking reservation ownership patch

on:
  push:
    branches:
      - seo-booking-reservation-owner-2026-10-12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: seo-booking-reservation-owner-2026-10-12
          fetch-depth: 0

      - name: Apply exact SEO replacements
        run: python scripts/seo_booking_reservation_owner_once.py

      - name: Validate diff
        run: |
          git diff --check
          git status --short

      - name: Commit surgical SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: align booking page to reservation software intent"
          git push origin HEAD:seo-booking-reservation-owner-2026-10-12
