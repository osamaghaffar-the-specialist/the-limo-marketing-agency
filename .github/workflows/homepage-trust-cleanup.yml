name: Homepage Trust Cleanup

on:
  push:
    branches:
      - seo-homepage-trust-cleanup-2026-10-13
    paths:
      - scripts/homepage-trust-cleanup.py
      - .github/workflows/homepage-trust-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-homepage-trust-cleanup-2026-10-13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply professional trust disclosure
        run: python scripts/homepage-trust-cleanup.py
      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO: clarify illustrative homepage metrics"
            git push origin HEAD:seo-homepage-trust-cleanup-2026-10-13
          fi
