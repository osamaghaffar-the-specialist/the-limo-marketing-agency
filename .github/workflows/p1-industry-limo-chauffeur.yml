name: P1 Industry Limo Chauffeur Optimization

on:
  push:
    branches:
      - seo-p1-industry-limo-chauffeur
    paths:
      - 'scripts/p1_industry_limo_chauffeur.py'
      - '.github/workflows/p1-industry-limo-chauffeur.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p1-industry-limo-chauffeur

      - name: Optimize limousine and chauffeur industry pages
        run: python scripts/p1_industry_limo_chauffeur.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- limousine-companies.html chauffeur-companies.html

      - name: Commit optimized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add limousine-companies.html chauffeur-companies.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize limousine and chauffeur industry intent"
          git push origin HEAD:seo-p1-industry-limo-chauffeur
