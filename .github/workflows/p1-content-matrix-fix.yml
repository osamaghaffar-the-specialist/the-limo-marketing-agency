name: P1 Content Matrix Fix

on:
  push:
    branches:
      - seo-p1-content-matrix

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p1-content-matrix
          fetch-depth: 0
      - name: Apply P1 fixes
        run: python scripts/p1_content_matrix_fix.py
      - name: Validate diff
        run: |
          git diff --check
          python scripts/p1_content_matrix_audit.py
          test -n "$(git diff --name-only '*.html')"
      - name: Commit P1 HTML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Complete P1 content trust and internal-link cleanup"
          git push origin HEAD:seo-p1-content-matrix
