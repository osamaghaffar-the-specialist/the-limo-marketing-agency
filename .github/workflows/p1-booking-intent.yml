name: P1 Booking Intent Optimization

on:
  push:
    branches:
      - seo-p1-booking-intent
    paths:
      - 'scripts/p1_booking_intent.py'
      - '.github/workflows/p1-booking-intent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p1-booking-intent
          fetch-depth: 0
      - name: Optimize booking page intent
        run: python scripts/p1_booking_intent.py
      - name: Validate diff
        run: |
          git diff --check
          grep -F 'Limo Booking Software &amp; System | The Limo Marketing Agency' booking-systems.html
          grep -F 'Limo Booking Software That Turns Website Visits into' booking-systems.html
          grep -F '"@id": "https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/booking-systems.html#webpage"' booking-systems.html
      - name: Commit optimized booking page
        run: |
          if git diff --quiet; then
            echo 'No booking-page changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add booking-systems.html
          git commit -m 'Optimize booking page for software and system intent'
          git push origin HEAD:seo-p1-booking-intent
