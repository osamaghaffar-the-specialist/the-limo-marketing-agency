name: P2 Round 4 URL Audit

on:
  push:
    branches:
      - seo-p2-round3-lab-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit live URL variants and status behavior
        run: |
          python - <<'PY'
          import subprocess, hashlib, re, json, tempfile, os

          urls = [
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/index.html',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/index',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/index.html/',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/services.html',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/services',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/services/',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/seo-for-limo-companies.html',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/seo-for-limo-companies',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/seo-for-limo-companies.html/',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/SEO-FOR-LIMO-COMPANIES.HTML',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/thank-you.html',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/404.html',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/this-url-should-not-exist-404-test',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/?utm_source=test',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/index.html?utm_source=test',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/robots.txt',
            'https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/sitemap.xml',
            'http://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/'
          ]

          def request(url, follow=False):
              with tempfile.TemporaryDirectory() as td:
                  body=os.path.join(td,'body')
                  hdr=os.path.join(td,'hdr')
                  cmd=['curl','-sS','--max-time','20','-D',hdr,'-o',body,'-w','%{http_code}\t%{url_effective}\t%{redirect_url}\t%{size_download}\t%{content_type}',url]
                  if follow:
                      cmd.insert(1,'-L')
                  p=subprocess.run(cmd,capture_output=True,text=True)
                  if p.returncode != 0:
                      return {'curl_error':p.stderr.strip(),'returncode':p.returncode}
                  parts=p.stdout.strip().split('\t')
                  b=open(body,'rb').read() if os.path.exists(body) else b''
                  text=b.decode('utf-8','ignore')
                  headers=open(hdr,'r',errors='ignore').read() if os.path.exists(hdr) else ''
                  title=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                  canon=(re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',text,re.I|re.S)
                         or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',text,re.I|re.S))
                  robots=(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)',text,re.I|re.S)
                          or re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']robots["\']',text,re.I|re.S))
                  locs=re.findall(r'(?im)^location:\s*(.+?)\s*$',headers)
                  return {
                    'code':parts[0] if len(parts)>0 else '',
                    'effective':parts[1] if len(parts)>1 else '',
                    'redirect_url':parts[2] if len(parts)>2 else '',
                    'bytes':parts[3] if len(parts)>3 else '',
                    'content_type':parts[4] if len(parts)>4 else '',
                    'sha256':hashlib.sha256(b).hexdigest(),
                    'title':re.sub(r'\s+',' ',title.group(1)).strip() if title else '',
                    'canonical':canon.group(1) if canon else '',
                    'robots':robots.group(1) if robots else '',
                    'locations':locs,
                  }

          results={}
          for url in urls:
              raw=request(url,False)
              follow=request(url,True)
              results[url]={'raw':raw,'follow':follow}
              print('URL',url)
              print('RAW',json.dumps(raw,sort_keys=True))
              print('FOLLOW',json.dumps(follow,sort_keys=True))

          root='https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/'
          idx='https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/index.html'
          r=results[root]['raw']; i=results[idx]['raw']
          print('ROOT_INDEX_SAME_HASH', r.get('sha256') == i.get('sha256'))
          print('ROOT_CANONICAL', r.get('canonical'))
          print('INDEX_CANONICAL', i.get('canonical'))
          print('RANDOM_404_STATUS', results['https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/this-url-should-not-exist-404-test']['raw'].get('code'))
          print('DIRECT_404_HTML_STATUS', results['https://osamaghaffar-the-specialist.github.io/the-limo-marketing-agency/404.html']['raw'].get('code'))
          print('AUDIT_DONE')
          PY
