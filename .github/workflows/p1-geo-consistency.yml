name: P1 GEO Consistency Refinement

on:
  push:
    branches:
      - seo-p1-web-geo
    paths:
      - 'scripts/p1_geo_consistency.py'
      - '.github/workflows/p1-geo-consistency.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-p1-web-geo
      - run: python scripts/p1_geo_consistency.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo-ai-search-optimization.html
          git diff --cached --quiet && exit 0
          git commit -m "Align GEO service entity and page language"
          git push origin HEAD:seo-p1-web-geo
