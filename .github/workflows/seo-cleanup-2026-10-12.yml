name: SEO cleanup 2026-10-12

on:
  push:
    branches:
      - seo-technical-cleanup-2026-10-12
    paths:
      - .github/workflows/seo-cleanup-2026-10-12.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo-technical-cleanup-2026-10-12
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate cleanup
        run: python .github/scripts/seo_cleanup_2026_10_12.py

      - name: Remove temporary automation files
        run: |
          rm .github/scripts/seo_cleanup_2026_10_12.py
          rm .github/workflows/seo-cleanup-2026-10-12.yml

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "SEO: complete technical cleanup pass"
          git push origin HEAD:seo-technical-cleanup-2026-10-12
