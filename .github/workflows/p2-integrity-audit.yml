name: P2 Integrity Audit

on:
  push:
    branches:
      - seo-p2-performance

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify extracted assets and site references
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re, json, sys

          ROOT=Path('.')
          html_files=sorted(ROOT.glob('*.html'))
          html_names={p.name for p in html_files}
          errors=[]
          asset_refs=[]
          internal_links=[]
          data_uri_hits=[]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.refs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.add(a['id'])
                  for k in ('src','href','poster'):
                      if a.get(k): self.refs.append((tag,k,a[k]))
                  if a.get('srcset'):
                      for part in a['srcset'].split(','):
                          u=part.strip().split()[0] if part.strip() else ''
                          if u: self.refs.append((tag,'srcset',u))

          parsed={}
          for pth in html_files:
              text=pth.read_text(encoding='utf-8',errors='strict')
              p=P(); p.feed(text); parsed[pth.name]=(p,text)
              if re.search(r'data:image/[^;]+;base64,',text,re.I):
                  data_uri_hits.append(pth.name)

              # JSON-LD parse smoke test
              for i,b in enumerate(re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>\s*(.*?)\s*</script>',text,re.I|re.S),1):
                  try: json.loads(b)
                  except Exception as e: errors.append(f'JSONLD|{pth.name}|block={i}|{e}')

              # inline CSS url(...) refs
              for m in re.finditer(r'url\(\s*["\']?([^"\')]+)',text,re.I):
                  u=m.group(1).strip()
                  if u: p.refs.append(('style','url',u))

          def local_path(u):
              if not u or u.startswith(('#','mailto:','tel:','javascript:')): return None,None
              if u.startswith(('http://','https://','//')): return None,None
              parts=urlsplit(u)
              path=parts.path
              frag=parts.fragment
              if path.startswith('./'): path=path[2:]
              if path.startswith('/the-limo-marketing-agency/'):
                  path=path[len('/the-limo-marketing-agency/'):]
              elif path.startswith('/'):
                  return None,None
              return path,frag

          for src,(p,text) in parsed.items():
              for tag,attr,u in p.refs:
                  path,frag=local_path(u)
                  if path is None: continue
                  if path in ('','.','./'):
                      target='index.html'
                  else:
                      target=path
                  if target.endswith('.html') or target in html_names:
                      internal_links.append((src,u,target,frag))
                      if target not in html_names:
                          errors.append(f'LINK_MISSING|{src}|{u}|{target}')
                      elif frag and frag not in parsed[target][0].ids:
                          errors.append(f'FRAGMENT_MISSING|{src}|{u}|{target}#{frag}')
                  else:
                      # Skip fragments-only and query-only values; otherwise local file must exist.
                      if target:
                          asset_refs.append((src,u,target))
                          if not (ROOT/target).is_file():
                              errors.append(f'ASSET_MISSING|{src}|{u}|{target}')

          embedded=list((ROOT/'assets'/'embedded').glob('*')) if (ROOT/'assets'/'embedded').exists() else []
          if len(embedded)!=21:
              errors.append(f'EMBEDDED_ASSET_COUNT|expected=21|actual={len(embedded)}')
          logo=ROOT/'assets'/'brand-logo.png'
          if not logo.is_file() or logo.stat().st_size!=31467:
              errors.append(f'BRAND_LOGO|missing_or_size_wrong|actual={logo.stat().st_size if logo.exists() else 0}')
          if data_uri_hits:
              errors.append('DATA_URI_REMAINS|'+','.join(data_uri_hits))

          # Confirm expected optimized HTML sizes are still below their pre-fix values.
          caps={'index.html':400000,'services.html':120000,'booking-systems.html':120000,'geo-ai-search-optimization.html':120000}
          for name,cap in caps.items():
              size=(ROOT/name).stat().st_size
              if size>cap: errors.append(f'HTML_SIZE_REGRESSION|{name}|{size}|cap={cap}')

          print('HTML_FILES',len(html_files))
          print('LOCAL_ASSET_REFS',len(asset_refs))
          print('INTERNAL_LINK_REFS',len(internal_links))
          print('EMBEDDED_ASSETS',len(embedded))
          print('DATA_URI_HITS',len(data_uri_hits))
          print('ERROR_COUNT',len(errors))
          for e in errors: print('ERROR|'+e)
          if errors: sys.exit(1)
          print('INTEGRITY_PASS')
          PY
