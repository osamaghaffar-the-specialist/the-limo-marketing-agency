name: One-time website design owner support

on:
  push:
    branches:
      - seo-website-design-owner-support-2026-10-12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: seo-website-design-owner-support-2026-10-12
          fetch-depth: 0

      - name: Apply exact replacements
        run: python scripts/seo_website_design_support_once.py

      - name: Validate diff
        run: git diff --check

      - name: Commit surgical SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: strengthen limo website design topic ownership"
          git push origin HEAD:seo-website-design-owner-support-2026-10-12
