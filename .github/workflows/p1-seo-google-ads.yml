name: P1 SEO and Google Ads Optimization

on:
  push:
    branches:
      - seo-p1-seo-google-ads
    paths:
      - 'scripts/p1_seo_google_ads.py'
      - '.github/workflows/p1-seo-google-ads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p1-seo-google-ads

      - name: Optimize SEO and Google Ads pages
        run: python scripts/p1_seo_google_ads.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- seo-for-limo-companies.html google-ads-for-limo-companies.html

      - name: Commit optimized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-for-limo-companies.html google-ads-for-limo-companies.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize limo SEO and Google Ads intent"
          git push origin HEAD:seo-p1-seo-google-ads
