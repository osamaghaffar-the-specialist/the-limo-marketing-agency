name: Temporary Google Ads Ranking Brief

on:
  push:
    branches:
      - seo-google-ads-ranking-brief

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-google-ads-ranking-brief
          fetch-depth: 0
      - name: Apply controlled Google Ads page additions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('google-ads-for-limo-companies.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- GOOGLE ADS RANKING BRIEF ADDITIONS: 2026-10-10 -->'
          anchor = '<section aria-labelledby="architecture-title" class="section">'

          assert text.count(anchor) == 1, f'architecture anchor count={text.count(anchor)}'
          assert marker not in text, 'ranking brief marker already present'

          title_before = re.search(r'<title>(.*?)</title>', text, re.S).group(1)
          canonical_before = re.search(r'<link rel="canonical" href="([^"]+)"', text).group(1)
          h1_before = re.search(r'<h1[^>]*>(.*?)</h1>', text, re.S).group(1)

          block = r'''<!-- GOOGLE ADS RANKING BRIEF ADDITIONS: 2026-10-10 -->
<section aria-labelledby="audit-first-title" class="section">
<div class="container">
<div class="section-head">
<div><div class="kicker"><span class="dot"></span>What We Audit First</div><h2 id="audit-first-title">Before Increasing Budget, Fix the Signals That Decide Whether a Click Can <span>Become a Booking.</span></h2></div>
<p><strong>For a limo Google Ads account, budget is not the first lever.</strong> We first check the search terms, location controls, negative keywords, campaign segmentation, conversion actions, landing-page fit and booking path so more spend is not simply amplifying a weak setup.</p>
</div>
<div class="two-col">
<article class="panel">
<div class="kicker"><span class="dot"></span>Search &amp; Account Controls</div>
<h3>Is the Account Buying the Right Searches?</h3>
<p><strong>Search terms and match types:</strong> confirm the account is entering auctions for services the operator actually sells, not broad or research-only traffic.</p>
<p><strong>Negative keywords:</strong> remove recurring job-seeker, DIY, irrelevant vehicle, bargain-only or out-of-market searches when they do not match the business.</p>
<p><strong>Location settings:</strong> align targeting with real pickup/service areas and review where users are physically located versus what locations they mention in the query.</p>
<p><strong>Service segmentation:</strong> separate materially different airport, corporate, hourly or event demand when volume and economics justify different budgets, ads or landing pages.</p>
</article>
<article class="panel">
<div class="kicker"><span class="dot"></span>Conversion &amp; Booking Controls</div>
<h3>Can Google Learn Which Clicks Create Real Business?</h3>
<p><strong>Primary conversions:</strong> distinguish meaningful calls, quote requests and completed booking actions from soft page-view events.</p>
<p><strong>Landing-page fit:</strong> keep the search, ad message and destination aligned so an airport-transfer search does not land on an unrelated generic page.</p>
<p><strong>Booking path:</strong> check whether the visitor can move from the ad to a call, quote or booking without unnecessary friction.</p>
<p><strong>Budget decisions:</strong> scale only after the account has enough trustworthy search-term and conversion data to explain what is working. For budget planning, see our <a href="how-much-should-limo-company-spend-google-ads-2026.html">limo Google Ads budget guide</a>.</p>
</article>
</div>
</div>
</section>
<section aria-labelledby="account-structure-title" class="section soft">
<div class="container">
<div class="section-head">
<div><div class="kicker"><span class="dot"></span>Account Structure</div><h2 id="account-structure-title">How Should a Limo Google Ads Account Be <span>Structured?</span></h2></div>
<p><strong>Structure campaigns around materially different customer intent and economics, not one catch-all keyword list.</strong> The exact campaign count depends on market demand, service mix, margins and conversion volume, so there is no universal template that fits every operator.</p>
</div>
<div class="intent-grid">
<article class="intent-card"><span aria-hidden="true" class="brand-badge"><svg aria-hidden="true" class="brand-mark-svg" focusable="false" viewbox="0 0 2000 2000"><path d="M 999 200 L 336 583 L 336 1042 L 1001 1424 L 1397 1195 L 1397 846 L 1472 802 L 1473 1239 L 1000 1513 L 336 1130 L 336 1349 L 1000 1732 L 1663 1349 L 1663 583 L 1568 528 L 868 932 L 868 1041 L 962 1096 L 1207 957 L 1207 1085 L 999 1206 L 528 934 L 525 693 L 998 419 L 1075 463 L 602 737 L 602 888 L 790 997 L 793 845 L 1455 463 Z" fill="currentColor"></path></svg></span><h3>Airport &amp; Route Demand</h3><p>Airport names, route pairs and private-transfer searches often deserve their own message and destination when the operator serves them consistently.</p><div class="query">Goal: match the exact trip intent</div></article>
<article class="intent-card"><span aria-hidden="true" class="brand-badge"><svg aria-hidden="true" class="brand-mark-svg" focusable="false" viewbox="0 0 2000 2000"><path d="M 999 200 L 336 583 L 336 1042 L 1001 1424 L 1397 1195 L 1397 846 L 1472 802 L 1473 1239 L 1000 1513 L 336 1130 L 336 1349 L 1000 1732 L 1663 1349 L 1663 583 L 1568 528 L 868 932 L 868 1041 L 962 1096 L 1207 957 L 1207 1085 L 999 1206 L 528 934 L 525 693 L 998 419 L 1075 463 L 602 737 L 602 888 L 790 997 L 793 845 L 1455 463 Z" fill="currentColor"></path></svg></span><h3>Corporate &amp; Executive</h3><p>Corporate-account and executive-transport searches can have different qualification criteria, messaging and lifetime value from leisure demand.</p><div class="query">Goal: protect high-value business intent</div></article>
<article class="intent-card"><span aria-hidden="true" class="brand-badge"><svg aria-hidden="true" class="brand-mark-svg" focusable="false" viewbox="0 0 2000 2000"><path d="M 999 200 L 336 583 L 336 1042 L 1001 1424 L 1397 1195 L 1397 846 L 1472 802 L 1473 1239 L 1000 1513 L 336 1130 L 336 1349 L 1000 1732 L 1663 1349 L 1663 583 L 1568 528 L 868 932 L 868 1041 L 962 1096 L 1207 957 L 1207 1085 L 999 1206 L 528 934 L 525 693 L 998 419 L 1075 463 L 602 737 L 602 888 L 790 997 L 793 845 L 1455 463 Z" fill="currentColor"></path></svg></span><h3>Hourly Chauffeur</h3><p>Hourly bookings should be separated when pricing, minimum hours and customer expectations differ from point-to-point trips.</p><div class="query">Goal: align qualification with service rules</div></article>
<article class="intent-card"><span aria-hidden="true" class="brand-badge"><svg aria-hidden="true" class="brand-mark-svg" focusable="false" viewbox="0 0 2000 2000"><path d="M 999 200 L 336 583 L 336 1042 L 1001 1424 L 1397 1195 L 1397 846 L 1472 802 L 1473 1239 L 1000 1513 L 336 1130 L 336 1349 L 1000 1732 L 1663 1349 L 1663 583 L 1568 528 L 868 932 L 868 1041 L 962 1096 L 1207 957 L 1207 1085 L 999 1206 L 528 934 L 525 693 L 998 419 L 1075 463 L 602 737 L 602 888 L 790 997 L 793 845 L 1455 463 Z" fill="currentColor"></path></svg></span><h3>Events &amp; Specialty Trips</h3><p>Wedding, prom, group or specialty searches should only receive dedicated structure where those services are genuinely offered and commercially important.</p><div class="query">Goal: avoid mixing unrelated economics</div></article>
</div>
</div>
</section>'''

          text = text.replace(anchor, block + '\n' + anchor, 1)

          assert text.count(marker) == 1
          assert re.search(r'<title>(.*?)</title>', text, re.S).group(1) == title_before
          assert re.search(r'<link rel="canonical" href="([^"]+)"', text).group(1) == canonical_before
          assert re.search(r'<h1[^>]*>(.*?)</h1>', text, re.S).group(1) == h1_before
          assert text.count('<h1') == 1
          assert 'how-much-should-limo-company-spend-google-ads-2026.html' in text

          path.write_text(text, encoding='utf-8')
          print('Controlled Google Ads ranking additions applied successfully.')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-google-ads-ranking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-ads-for-limo-companies.html .github/workflows/tmp-google-ads-ranking.yml
          git commit -m "SEO: Implement Google Ads ranking brief"
          git push origin seo-google-ads-ranking-brief
