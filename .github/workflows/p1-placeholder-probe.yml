name: P1 Placeholder Probe

on:
  push:
    branches:
      - seo-p1-content-matrix

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-p1-content-matrix
      - run: python scripts/p1_placeholder_probe.py
