name: P1 Website and GEO Optimization

on:
  push:
    branches:
      - seo-p1-web-geo
    paths:
      - 'scripts/p1_web_geo.py'
      - '.github/workflows/p1-web-geo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p1-web-geo

      - name: Optimize website design and GEO pages
        run: python scripts/p1_web_geo.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- limo-website-design.html geo-ai-search-optimization.html

      - name: Commit optimized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add limo-website-design.html geo-ai-search-optimization.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize limo website design and GEO intent"
          git push origin HEAD:seo-p1-web-geo
