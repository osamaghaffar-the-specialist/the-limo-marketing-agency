name: UK Pricing Meta QA

on:
  push:
    branches:
      - seo-uk-pricing-meta-qa-2026-10-14
    paths:
      - .github/workflows/uk-pricing-meta-qa.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-uk-pricing-meta-qa-2026-10-14
      - name: Shorten meta description safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('uk/taxi-dispatch-system-prices/index.html')
          text=p.read_text(encoding='utf-8')
          old='<meta name="description" content="Compare published UK taxi dispatch software prices, pricing models, setup costs and common extras. See source-backed costs by fleet size before choosing a system."/>'
          new='<meta name="description" content="Compare published UK taxi dispatch software prices, pricing models and common extras. See source-backed costs by fleet size before choosing a system."/>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one old meta description, found {text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          assert len('Compare published UK taxi dispatch software prices, pricing models and common extras. See source-backed costs by fleet size before choosing a system.') == 149
          print('META_QA=PASS')
          PY
      - name: Commit QA fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uk/taxi-dispatch-system-prices/index.html
          git commit -m "SEO: trim UK pricing meta description"
          git push origin HEAD:seo-uk-pricing-meta-qa-2026-10-14
