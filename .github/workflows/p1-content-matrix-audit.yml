name: P1 Content Matrix Audit

on:
  push:
    branches:
      - seo-p1-content-matrix

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo-p1-content-matrix
      - name: Run content and internal-link audit
        run: python scripts/p1_content_matrix_audit.py
